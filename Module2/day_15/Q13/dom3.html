<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1 - Interactive DOM Manipulation</title>
</head>
<body>

    <h2>Interactive DOM Manipulation</h2>

    <label>Enter Background Color:</label>
    <input type="text" id="bg-color-input" placeholder="e.g., blue, red, green">
    <button id="change-bg-btn">Change Background</button>
    <br><br>

    <label>Enter New Text:</label>
    <input type="text" id="text-input" placeholder="Type something here">
    <button id="update-text-btn">Update Text</button>
    <br><br>

    <div id="content-box" style="width: 250px; height: 120px; border: 1px solid black; padding: 10px;">
        Initial text inside the div.
    </div>

    <!-- External Script -->
    <script src="dom3.js"></script>

</body>
</html>
