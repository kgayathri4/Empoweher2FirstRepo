<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>User Notes</h1>

    <textarea id="notes" placeholder="Enter your notes here..." rows="10"></textarea>

    <div class="controls">
      <button id="save-btn" class="btn">Save Notes</button>
      <button id="load-btn" class="btn">Load Notes</button>
      <button id="clear-btn" class="btn">Clear Notes</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
